{"name":"Make videos","on":{"schedule":[{"cron":"0 11 * * *"}],"workflow_dispatch":{"inputs":{"videos":{"description":"How many videos to make","default":"3"}}}},"permissions":{"contents":"write"},"concurrency":{"group":"make-videos","cancel-in-progress":false},"jobs":{"make":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Read settings","id":"cfg","run":"python3 -c \"import json;c=json.load(open('config.json'));print('enabled='+str(c.get('enabled',True)).lower());print('videos='+str(c.get('videos_per_day',3)))\" >> \"$GITHUB_OUTPUT\""},{"name":"Decide","id":"go","run":"if [ \"${{ github.event_name }}\" = \"schedule\" ] && [ \"${{ steps.cfg.outputs.enabled }}\" != \"true\" ]; then\n  echo \"run=false\" >> \"$GITHUB_OUTPUT\"; echo \"Daily videos are switched off in config.json\"\nelse\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"count=${{ github.event.inputs.videos || steps.cfg.outputs.videos }}\" >> \"$GITHUB_OUTPUT\"\nfi\n"},{"if":"steps.go.outputs.run == 'true'","uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"if":"steps.go.outputs.run == 'true'","run":"sudo apt-get update && sudo apt-get install -y ffmpeg && pip install -r requirements.txt"},{"if":"steps.go.outputs.run == 'true'","run":"python generate.py --videos ${{ steps.go.outputs.count }}","env":{"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}","PIXABAY_API_KEY":"${{ secrets.PIXABAY_API_KEY }}"}},{"if":"steps.go.outputs.run == 'true'","run":"python tools/publish.py"},{"if":"steps.go.outputs.run == 'true'","name":"Save to the website","run":"git config user.name \"github-actions\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add docs history.json\ngit commit -m \"New videos\" || echo \"nothing to commit\"\ngit pull --rebase || true\ngit push\n"}]}}}
